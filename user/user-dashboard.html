<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ড্যাশবোর্ড — MicroTask</title>
  <link rel="stylesheet" href="../css/user.css">
  <link rel="stylesheet" href="../css/lottery.css">
</head>
<body>
  <div class="mobile-container">
    <header class="top-nav">
      <div class="brand-title">⚡ MicroTask</div>
      <div class="user-badge">
        <span class="coin-icon">🪙</span>
        <span class="user-balance-val">৳0</span>
      </div>
    </header>

    <div style="padding: 16px;">
      <h3 style="margin-bottom: 12px;">স্বাগতম, আরিফুল! 👋</h3>
      <div class="stat-item" style="text-align: left; margin-bottom: 16px;">
        <div style="color: var(--text-secondary); font-size: 0.8rem;">মোট ডেমো ব্যালেন্স</div>
        <div class="user-balance-val" style="font-size: 1.8rem; font-weight: 800; color: var(--gold-primary);">৳0</div>
      </div>

      <h4 style="margin-bottom: 10px;">জনপ্রিয় ফিচারসমূহ</h4>
      <a href="lottery.html" style="text-decoration: none;">
        <div class="lottery-hero" style="margin: 0 0 16px 0; border: 1px solid var(--gold-primary);">
          <span class="hero-tag">🔥 মেগা ইভেন্ট</span>
          <h2 style="color: #fff; font-size: 1.3rem;">Weekly Lottery</h2>
          <p style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 4px;">৳৫০,০০০ গ্র্যান্ড প্রাইজ ড্র-তে অংশ নিন!</p>
          <div style="margin-top: 14px;" class="btn btn-gold">লটারি দেখুন</div>
        </div>
      </a>
    </div>

    <nav class="bottom-nav">
      <a href="user-dashboard.html" class="nav-item active"><span class="nav-icon">🏠</span>হোম</a>
      <a href="lottery.html" class="nav-item"><span class="nav-icon">🎟️</span>লটারি</a>
      <a href="my-tickets.html" class="nav-item"><span class="nav-icon">🏷️</span>টিকিট</a>
      <a href="user-profile.html" class="nav-item"><span class="nav-icon">👤</span>প্রোফাইল</a>
    </nav>
  </div>
  <script src="../js/user-auth.js"></script>
</body>
</html>
