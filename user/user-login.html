<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>লগইন — MicroTask</title>
  <link rel="stylesheet" href="../css/user.css">
</head>
<body>
  <div class="mobile-container" style="display: flex; flex-direction: column; justify-content: center; padding: 24px;">
    <div style="text-align: center; margin-bottom: 30px;">
      <h1 class="brand-title" style="font-size: 1.8rem; justify-content: center;">MicroTask</h1>
      <p style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 4px;">Earn & Grow — ডেমো ইউজার প্যানেল</p>
    </div>

    <div style="background: var(--bg-card); padding: 24px; border-radius: 20px; border: 1px solid var(--border-color);">
      <h2 style="font-size: 1.2rem; margin-bottom: 16px; color: var(--gold-primary);">ডেমো লগইন</h2>
      <div style="margin-bottom: 15px;">
        <label style="font-size: 0.8rem; color: var(--text-secondary);">মোবাইল নম্বর</label>
        <input type="text" value="01712-345678" style="width: 100%; padding: 12px; margin-top: 6px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 10px; color: #fff;" readonly>
      </div>
      <div style="margin-bottom: 20px;">
        <label style="font-size: 0.8rem; color: var(--text-secondary);">পিন / পাসওয়ার্ড</label>
        <input type="password" value="123456" style="width: 100%; padding: 12px; margin-top: 6px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 10px; color: #fff;" readonly>
      </div>
      <a href="lottery.html" class="btn btn-gold" style="width: 100%; text-align: center;">লগইন করুন (ডেমো)</a>
    </div>
  </div>
</body>
</html>
